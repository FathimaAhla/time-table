# =====================================================================
# Deploy Timetable Application (Laravel 13 + Inertia React)
# ---------------------------------------------------------------------
# Trigger : every push to the "deploy" branch, or manually from the
#           GitHub "Actions" tab (workflow_dispatch).
# Target  : CloudPanel site https://timetable.halasoft.cc
#
# Required GitHub repository secrets
# (Settings > Secrets and variables > Actions > Repository secrets):
#   SSH_HOST  - server IP or hostname only (no https://, no user@)
#   SSH_USER  - CloudPanel site user (halasoft-timetable)
#   SSH_KEY   - private SSH key whose public key is in
#               /home/halasoft-timetable/.ssh/authorized_keys
#
# Server must already have:
#   - $SITE_DIR/.env with production values (APP_KEY, DB_*, APP_URL ...)
#   - CloudPanel vhost root pointing to $SITE_DIR/public
#   - PHP 8.4 and rsync installed
# =====================================================================

name: Deploy Timetable Application

on:
  push:
    branches: [deploy]
  workflow_dispatch:

# Never run two deployments at the same time; queue the newer one.
concurrency:
  group: timetable-deploy
  cancel-in-progress: false

env:
  APP_URL: https://timetable.halasoft.cc
  SITE_DIR: /home/halasoft-timetable/htdocs/timetable.halasoft.cc

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Get the source code of the pushed commit.
      - name: Checkout
        uses: actions/checkout@v4

      # 2. PHP is needed for Composer and for the Wayfinder Vite plugin,
      #    which runs "php artisan wayfinder:generate" during the build.
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip
          tools: composer:v2
          coverage: none

      # 3. Cache Composer downloads between runs (faster deploys).
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # 4. Production PHP packages only (no PHPUnit/Pint etc.).
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # 5. Temporary .env so artisan can boot on the runner while Vite /
      #    Wayfinder generate the route helpers. Deleted after the build
      #    and never uploaded (rsync also excludes /.env).
      - name: Prepare build environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 6. Build React/Tailwind assets into public/build.
      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      # 7. Strip everything the server does not need and make sure the
      #    Vite manifest exists (otherwise every page would 500).
      - name: Remove development files
        run: |
          rm -f .env
          rm -rf node_modules tests docs .github .git \
            .agents .claude .codex .cursor .junie .vscode .idea .fleet .zed \
            AGENTS.md CLAUDE.md README.md boost.json .mcp.json build_srs.js \
            phpunit.xml phpstan.neon pint.json .phpunit.result.cache \
            .editorconfig .env.example .gitattributes .gitignore \
            storage/logs/* storage/framework/cache/* \
            storage/framework/sessions/* storage/framework/views/*
          test -f public/build/manifest.json || {
            echo "Vite manifest missing"
            exit 1
          }

      # 8. Write the SSH key and an ssh config alias called "deploy".
      #    Uses only 3 secrets: SSH_HOST, SSH_USER, SSH_KEY (port 22).
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          # Fail with a clear message if a required secret is missing.
          for name in SSH_HOST SSH_USER SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty. Add it under Settings > Secrets and variables > Actions > Repository secrets."
              exit 1
            fi
          done

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Strip accidental "https://", "user@", paths and spaces from SSH_HOST.
          HOST=$(printf '%s' "$SSH_HOST" | tr -d '[:space:]' | sed -E 's#^[a-z]+://##; s#^.*@##; s#[/:].*$##')

          printf '%s\n' \
            "Host deploy" \
            "  HostName $HOST" \
            "  User $SSH_USER" \
            "  Port 22" \
            "  IdentityFile ~/.ssh/id_deploy" \
            "  IdentitiesOnly yes" \
            "  StrictHostKeyChecking accept-new" \
            "  ConnectTimeout 20" > ~/.ssh/config
          chmod 600 ~/.ssh/config

          # Test the connection and show the real reason if it fails.
          if ! ssh deploy "echo SSH connection OK"; then
            echo "::error::SSH to the server failed. If the log says 'timed out', SSH_HOST must be the server IP (not the Cloudflare domain) and port 22 must be open to 0.0.0.0/0 in CloudPanel > Security. If it says 'Permission denied', the public key is not in /home/$SSH_USER/.ssh/authorized_keys."
            exit 1
          fi

      # 9. Stop early if the production .env is missing on the server.
      - name: Check server .env
        run: |
          ssh deploy "test -f '$SITE_DIR/.env'" || {
            echo "Missing $SITE_DIR/.env on the server"
            exit 1
          }

      # 10. Sync files. --delete removes server files not in the build,
      #     EXCEPT the excluded paths below (server-owned data).
      - name: Upload application files
        run: |
          rsync -az --delete \
            --exclude='/.env' \
            --exclude='/.user.ini' \
            --exclude='/storage' \
            --exclude='/public/storage' \
            --exclude='/public/.well-known' \
            --exclude='/database/database.sqlite' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='/tests' \
            --exclude='node_modules' \
            --exclude='/docs' \
            ./ "deploy:$SITE_DIR/"

      # 11. Run Laravel commands on the server inside maintenance mode.
      #     The trap always brings the site back up, even on error.
      - name: Run Laravel commands
        run: |
          ssh deploy "SITE_DIR='$SITE_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$SITE_DIR"
          PHP=$(command -v php8.4 || command -v php)

          mkdir -p storage/app/public \
            storage/framework/{cache/data,sessions,views} \
            storage/logs bootstrap/cache

          "$PHP" artisan down --retry=15 || true
          trap '"$PHP" artisan up' EXIT

          "$PHP" artisan storage:link --force
          "$PHP" artisan migrate --force
          "$PHP" artisan optimize:clear
          "$PHP" artisan config:cache
          "$PHP" artisan route:cache
          "$PHP" artisan view:cache
          "$PHP" artisan event:cache
          "$PHP" artisan queue:restart || true
          REMOTE

      # 12. Confirm the site responds (200 OK or 302 redirect to login).
      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$APP_URL" || echo 000)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed for $APP_URL"
          exit 1

      # 13. If anything failed, make sure the site is not left in
      #     maintenance mode.
      - name: Bring site up (safety net)
        if: failure()
        run: |
          [ -f ~/.ssh/config ] || { echo "SSH not configured, skipping"; exit 0; }
          ssh deploy "SITE_DIR='$SITE_DIR' bash -s" <<'REMOTE' || true
          cd "$SITE_DIR" || exit 0
          PHP=$(command -v php8.4 || command -v php)
          [ -f artisan ] && "$PHP" artisan up || true
          REMOTE

      # 14. Always remove the private key from the runner.
      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
